<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Novice Chemist</title>
    
    <!-- Error Handling -->
    <script>
        window.onerror = function(msg, url, line) {
            document.body.innerHTML = `<div style="padding:20px;color:red;text-align:center"><h3>Error</h3><p>${msg}</p><p>${url}:${line}</p><button onclick="location.reload()" style="padding:10px;">Reload</button></div>`;
        };
    </script>

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <!-- Shared Config -->
    <script>
      window.addEventListener('load', function() {
          if (window.tailwind) {
              tailwind.config = {
                theme: {
                  extend: {
                    colors: {
                      'chem-bg': '#FDFCF8',
                      'chem-card': '#FFFFFF',
                      'chem-text-main': '#44403C',
                      'chem-text-muted': '#78716C',
                      'chem-accent': '#D97706',
                      'chem-border': '#E7E5E4',
                    },
                    fontFamily: {
                      serif: ['"Playfair Display"', 'serif'],
                      sans: ['"Inter"', 'sans-serif'],
                    },
                    animation: {
                      'blob': 'blob 7s infinite',
                      'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                      blob: {
                        '0%': { transform: 'translate(0px, 0px) scale(1)' },
                        '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                        '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                        '100%': { transform: 'translate(0px, 0px) scale(1)' },
                      },
                      fadeIn: {
                        '0%': { opacity: '0', transform: 'translateY(10px)' },
                        '100%': { opacity: '1', transform: 'translateY(0)' },
                      }
                    }
                  }
                }
              }
          }
      });
    </script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="/index.css">
</head>
<body class="flex flex-col min-h-screen bg-chem-bg">
    
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content Area (Dynamic) -->
    <main id="app" class="flex-grow flex flex-col">
        <!-- Initial Loading State -->
        <div class="flex items-center justify-center h-screen text-chem-text-muted flex-col gap-4">
            <div class="w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
            <div class="animate-pulse font-serif text-sm tracking-widest">INITIALIZING LAB...</div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Main Logic Script -->
    <script src="app.js"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
