<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Novice Chemist</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- KaTeX (Math) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body { font-family: 'Inter', sans-serif; }
      h1, h2, h3, h4, h5, h6, .font-serif { font-family: 'Playfair Display', serif; }
      
      /* Animations */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #e5e5e5; border-radius: 20px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #d4d4d4; }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-stone-50 text-stone-800 antialiased selection:bg-teal-100 selection:text-teal-900 overflow-hidden h-screen flex flex-col">
    
    <!-- Navbar Container -->
    <header id="navbar-container" class="flex-none z-50"></header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Sidebar Container -->
        <aside id="sidebar-container" class="fixed inset-y-0 left-0 z-40 w-80 bg-stone-50/95 border-r border-stone-200 transform transition-transform duration-300 md:relative md:translate-x-0 -translate-x-full hidden md:block backdrop-blur-xl md:backdrop-blur-none"></aside>
        
        <!-- Main Content -->
        <main id="main-content" class="flex-1 overflow-y-auto scroll-smooth bg-white w-full custom-scrollbar">
            <!-- Content Injected Here -->
        </main>
        
        <!-- Mobile Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-stone-900/20 backdrop-blur-sm z-30 hidden transition-opacity duration-300"></div>
    </div>

    <!-- MAIN APPLICATION SCRIPT -->
    <script>
      // ==========================================
      // 1. UTILITIES
      // ==========================================
      window.AppUtils = {
        underConstructionHTML: function(title, category) {
          return `
            <div class="flex flex-col items-center justify-center py-24 text-center animate-fade-in bg-stone-50 rounded-3xl border border-dashed border-stone-200">
              <div class="bg-white p-6 rounded-full mb-6 shadow-sm border border-stone-100">
                 <i data-lucide="cone" class="w-8 h-8 text-teal-600/60"></i>
              </div>
              <div class="inline-block px-3 py-1 mb-4 text-xs font-bold tracking-widest text-teal-700 uppercase bg-teal-50 rounded-full border border-teal-100">
                ${category}
              </div>
              <h3 class="text-2xl font-serif text-stone-700 mb-3">Content Coming Soon</h3>
              <p class="text-stone-500 max-w-md px-4 leading-relaxed mb-2">
                We are actively working on:
              </p>
              <p class="font-serif text-lg text-stone-800 font-medium max-w-lg">
                ${title}
              </p>
              <div class="mt-8 px-4 py-2 bg-yellow-50 text-yellow-800 text-xs font-bold uppercase tracking-widest rounded-full border border-yellow-100">
                  Under Construction
              </div>
            </div>
          `;
        }
      };

      // ==========================================
      // 2. DATA DEFINITIONS
      // ==========================================
      window.AppData = {};
      const u = window.AppUtils.underConstructionHTML;

      // General Chemistry
      window.AppData.general = {
        id: 'general',
        title: 'General Chemistry',
        description: 'Foundational concepts of matter and energy.',
        modules: [
          {
            id: 'gen_struct',
            title: 'Atomic Structure',
            topics: [
              { id: 'subatomic', title: 'Subatomic Particles', content: u("Subatomic Particles", "General") },
              { id: 'elec_config', title: 'Electronic Configuration', content: u("Electronic Configuration", "General") },
            ]
          },
          {
            id: 'gen_bond',
            title: 'Bonding & Structure',
            topics: [
              { id: 'ionic', title: 'Ionic Bonding', content: u("Ionic Bonding", "General") },
              { id: 'covalent', title: 'Covalent Bonding', content: u("Covalent Bonding", "General") },
              { id: 'vsepr', title: 'Shapes of Molecules', content: u("Shapes of Molecules", "General") },
            ]
          }
        ]
      };

      // Inorganic Chemistry
      window.AppData.inorganic = {
        id: 'inorganic',
        title: 'Inorganic Chemistry',
        description: 'Study of the elements and non-carbon compounds.',
        modules: [
          {
            id: 'in_sblock',
            title: 's-Block Elements',
            topics: [
              { id: 'grp1', title: 'Group 1: Alkali Metals', content: u("Group 1 Elements", "Inorganic") },
              { id: 'grp2', title: 'Group 2: Alkaline Earth Metals', content: u("Group 2 Elements", "Inorganic") },
            ]
          },
          {
            id: 'in_pblock',
            title: 'p-Block Elements',
            topics: [
              { id: 'grp13', title: 'Group 13', content: u("Group 13 Elements", "Inorganic") },
              { id: 'grp15', title: 'Group 15 (Nitrogen)', content: u("Group 15 Elements", "Inorganic") },
            ]
          }
        ]
      };

      // Organic Chemistry
      window.AppData.organic = {
        id: 'organic',
        title: 'Organic Chemistry',
        description: 'Structure, properties, and reactions of carbon compounds.',
        modules: [
          {
            id: 'opt1',
            title: 'Option 1: Fundamentals & Basics',
            description: 'Foundation before specific reactions.',
            topics: [
              { 
                id: 'ch1', 
                title: 'Ch 1: Fundamentals', 
                content: `
                  <div class="space-y-6">
                    <div class="bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-r-lg mb-8">
                      <h4 class="font-serif font-bold text-indigo-900 mb-1">Module Objective</h4>
                      <p class="text-sm text-indigo-800">Understand the unique nature of Carbon, hybridization, and the diverse ways organic molecules can exist as isomers.</p>
                    </div>

                    <h3>1. The Nature of Carbon</h3>
                    <p>Carbon is unique because of <strong>catenation</strong>—the ability to form long chains and rings with itself. This, combined with its tetravalency (forming 4 bonds), allows for millions of organic compounds.</p>
                    <ul class="list-disc pl-5 space-y-2">
                      <li><strong>Tetravalency:</strong> Carbon has 4 valence electrons ($2s^2 2p^2$). It needs 4 more to complete its octet.</li>
                      <li><strong>Hybridization:</strong> Mixing atomic orbitals to form new equivalent hybrid orbitals ($sp^3, sp^2, sp$).</li>
                    </ul>

                    <h3>2. Hybridization Types</h3>
                    <div class="overflow-x-auto">
                      <table class="min-w-full text-sm text-left text-stone-600 border border-stone-200 rounded-lg">
                        <thead class="text-xs text-stone-700 uppercase bg-stone-100">
                          <tr>
                            <th class="px-6 py-3">Type</th>
                            <th class="px-6 py-3">Geometry</th>
                            <th class="px-6 py-3">Bond Angle</th>
                            <th class="px-6 py-3">Example</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr class="bg-white border-b hover:bg-stone-50">
                            <td class="px-6 py-4 font-medium">$sp^3$</td>
                            <td class="px-6 py-4">Tetrahedral</td>
                            <td class="px-6 py-4">$109.5^\\circ$</td>
                            <td class="px-6 py-4">Methane ($CH_4$)</td>
                          </tr>
                          <tr class="bg-white border-b hover:bg-stone-50">
                            <td class="px-6 py-4 font-medium">$sp^2$</td>
                            <td class="px-6 py-4">Trigonal Planar</td>
                            <td class="px-6 py-4">$120^\\circ$</td>
                            <td class="px-6 py-4">Ethene ($C_2H_4$)</td>
                          </tr>
                          <tr class="bg-white hover:bg-stone-50">
                            <td class="px-6 py-4 font-medium">$sp$</td>
                            <td class="px-6 py-4">Linear</td>
                            <td class="px-6 py-4">$180^\\circ$</td>
                            <td class="px-6 py-4">Ethyne ($C_2H_2$)</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>

                    <h3>3. Isomerism</h3>
                    <p>Compounds with the same molecular formula but different arrangements of atoms.</p>
                    <div class="grid md:grid-cols-2 gap-4 mt-4">
                        <div class="p-4 border border-stone-200 rounded-lg hover:border-teal-400 transition-colors">
                            <h4 class="font-bold text-stone-800 mb-2">Structural Isomerism</h4>
                            <ul class="list-disc pl-4 text-sm text-stone-600 space-y-1">
                                <li>Chain Isomerism</li>
                                <li>Position Isomerism</li>
                                <li>Functional Group Isomerism</li>
                            </ul>
                        </div>
                        <div class="p-4 border border-stone-200 rounded-lg hover:border-teal-400 transition-colors">
                            <h4 class="font-bold text-stone-800 mb-2">Stereoisomerism</h4>
                            <ul class="list-disc pl-4 text-sm text-stone-600 space-y-1">
                                <li>Geometric (cis/trans)</li>
                                <li>Optical (Enantiomers)</li>
                            </ul>
                        </div>
                    </div>
                  </div>
                ` 
              },
              { 
                id: 'ch2', 
                title: 'Ch 2: IUPAC Nomenclature', 
                content: u("IUPAC Nomenclature", "Organic") 
              },
            ]
          },
          {
            id: 'opt2',
            title: 'Option 2: Hydrocarbons & Halides',
            description: 'Carbon backbone and simple derivatives.',
            topics: [
              { id: 'ch3', title: 'Ch 3: Alkanes', content: u("Alkanes", "Organic") },
              { id: 'ch4', title: 'Ch 4: Alkenes/Olefins', content: u("Alkenes/Olefins", "Organic") },
              { id: 'ch5', title: 'Ch 5: Alkynes', content: u("Alkynes", "Organic") },
              { id: 'ch6', title: 'Ch 6: Aromatic Hydrocarbons', content: u("Aromatic Hydrocarbons (Benzene)", "Organic") },
              { id: 'ch7', title: 'Ch 7: Organic Halides', content: u("Organic Halides (The bridge to other compounds)", "Organic") },
            ]
          },
          {
            id: 'opt3',
            title: 'Option 3: Oxygen & Nitrogen Compounds',
            description: 'Complex functional groups.',
            topics: [
              { id: 'ch8', title: 'Ch 8: Alcohols', content: u("Alcohols", "Organic") },
              { id: 'ch9', title: 'Ch 9: Phenols', content: u("Phenols", "Organic") },
              { id: 'ch10', title: 'Ch 10: Aldehydes & Ketones', content: u("Aldehydes and Ketones", "Organic") },
              { id: 'ch11', title: 'Ch 11: Carboxylic Acids', content: u("Carboxylic Acids", "Organic") },
              { id: 'ch12', title: 'Ch 12: Acid Halides', content: u("Acid Halides", "Organic") },
              { id: 'ch13', title: 'Ch 13: Esters', content: u("Esters", "Organic") },
              { id: 'ch14', title: 'Ch 14: Amines', content: u("Amines", "Organic") },
            ]
          }
        ]
      };

      // Physical Chemistry
      window.AppData.physical = {
        id: 'physical',
        title: 'Physical Chemistry',
        description: 'The physics of chemical systems.',
        modules: [
          {
            id: 'phy_energy',
            title: 'Energetics',
            topics: [
              { id: 'enthalpy', title: 'Enthalpy Changes', content: u("Enthalpy", "Physical") },
              { id: 'entropy', title: 'Entropy & Gibbs Energy', content: u("Entropy", "Physical") },
            ]
          }
        ]
      };

      // Industrial Chemistry
      window.AppData.industrial = {
        id: 'industrial',
        title: 'Industrial Chemistry',
        description: 'Chemical processes in industry.',
        modules: [
          {
            id: 'ind_env',
            title: 'Environmental',
            topics: [
              { id: 'pollute', title: 'Pollution & Control', content: u("Environmental Pollution", "Industrial") },
            ]
          }
        ]
      };

      // ==========================================
      // 3. APPLICATION LOGIC
      // ==========================================
      const CATEGORIES = [
        window.AppData.general,
        window.AppData.inorganic,
        window.AppData.organic,
        window.AppData.physical,
        window.AppData.industrial
      ].filter(Boolean);

      // Router
      function getRouteFromHash() {
        const hash = window.location.hash.slice(1).toLowerCase();
        if (!hash) return { categoryId: null, moduleId: null, topicId: null };

        const parts = hash.split('/');
        const categoryId = parts[0];
        const moduleId = parts[1] || null;
        const topicId = parts[2] || null;

        const category = CATEGORIES.find(c => c.id === categoryId);
        if (category) {
          const effectiveModuleId = moduleId || category.modules[0].id;
          const module = category.modules.find(m => m.id === effectiveModuleId);
          const effectiveTopicId = topicId || (module ? module.topics[0].id : null);
          return { categoryId: category.id, moduleId: effectiveModuleId, topicId: effectiveTopicId };
        }
        return { categoryId: null, moduleId: null, topicId: null };
      }

      function pushRoute(categoryId, moduleId = null, topicId = null) {
        let hash = '';
        if (categoryId) {
          hash = categoryId;
          if (moduleId) {
            hash += `/${moduleId}`;
            if (topicId) hash += `/${topicId}`;
          }
        }
        window.location.hash = hash;
      }

      // Render Functions
      function renderNavbar(categories, currentCategoryId) {
        const container = document.getElementById('navbar-container');
        if (!container) return;

        const navItems = categories.map(cat => {
          const isActive = currentCategoryId === cat.id;
          return `
            <button
              data-action="nav-category"
              data-id="${cat.id}"
              class="
                px-4 py-2 rounded-full text-sm font-medium transition-all duration-200
                ${isActive 
                  ? 'bg-stone-100 text-teal-800 font-semibold' 
                  : 'text-stone-500 hover:text-stone-900 hover:bg-stone-50'
                }
              "
            >
              ${cat.title.replace(' Chemistry', '')}
            </button>
          `;
        }).join('');

        container.innerHTML = `
          <div class="h-16 bg-white border-b border-stone-200 flex items-center justify-between px-4 lg:px-8 shadow-sm w-full">
            <div class="flex items-center gap-3 cursor-pointer group" data-action="go-home">
              <div class="p-2 bg-stone-900 rounded-lg group-hover:bg-teal-700 transition-colors duration-300 pointer-events-none">
                <i data-lucide="beaker" class="w-5 h-5 text-white"></i>
              </div>
              <span class="font-serif font-bold text-lg md:text-xl text-stone-900 tracking-tight pointer-events-none">The Novice Chemist</span>
            </div>
            <div class="hidden md:flex items-center space-x-1">${navItems}</div>
            <button data-action="toggle-mobile-menu" class="md:hidden p-2 text-stone-600">
              <i data-lucide="menu"></i>
            </button>
          </div>
        `;
      }

      function renderSidebar(modules, currentModuleId, currentTopicId) {
        const container = document.getElementById('sidebar-container');
        if (!container) return;
        
        if (!modules || modules.length === 0) {
          container.innerHTML = '';
          container.classList.add('hidden');
          container.classList.remove('md:block');
          return;
        }

        container.classList.remove('hidden');
        container.classList.add('md:block');

        const html = modules.map(module => `
          <div class="space-y-3 mb-8">
            <div class="px-3 text-xs font-bold text-teal-700/80 uppercase tracking-widest border-l-2 border-teal-500/20 pl-3">
              ${module.title}
            </div>
            <ul class="space-y-0.5">
              ${module.topics.map(topic => {
                const isActive = currentModuleId === module.id && currentTopicId === topic.id;
                return `
                  <li>
                    <button
                      data-action="nav-topic"
                      data-module="${module.id}"
                      data-topic="${topic.id}"
                      class="
                        group w-full flex items-center gap-3 px-3 py-2 text-sm transition-all duration-300 rounded-md
                        ${isActive 
                          ? 'bg-stone-100 text-teal-900 font-medium translate-x-1' 
                          : 'text-stone-500 hover:bg-stone-50 hover:text-stone-900'
                        }
                      "
                    >
                      <span class="
                        w-1.5 h-1.5 rounded-full transition-all duration-300
                        ${isActive ? 'bg-teal-600 scale-125' : 'bg-stone-300 group-hover:bg-stone-400'}
                      "></span>
                      <span class="truncate flex-1 text-left pointer-events-none">${topic.title}</span>
                      ${isActive ? '<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-teal-400"></i>' : ''}
                    </button>
                  </li>
                `;
              }).join('')}
            </ul>
          </div>
        `).join('');

        container.innerHTML = `<div class="h-full flex flex-col pt-4 md:pt-0"><div class="flex-1 overflow-y-auto py-6 px-4 custom-scrollbar">${html}</div></div>`;
      }

      function renderWelcome() {
        const container = document.getElementById('main-content');
        if (!container) return;
        
        const categoryCards = CATEGORIES.map(cat => {
          const iconMap = {
              'general': 'atom',
              'inorganic': 'layers',
              'organic': 'flask-conical',
              'physical': 'flame',
              'industrial': 'factory'
          };
          const icon = iconMap[cat.id] || 'circle';

          return `
          <button data-action="nav-category" data-id="${cat.id}" class="flex flex-col items-center justify-center p-4 bg-white rounded-xl border border-stone-100 shadow-sm hover:shadow-md hover:border-teal-100 transition-all duration-300 cursor-pointer group w-full">
            <div class="mb-3 text-stone-400 group-hover:text-teal-600 transition-colors pointer-events-none">
              <i data-lucide="${icon}" class="w-6 h-6"></i>
            </div>
            <span class="text-sm font-medium text-stone-600 group-hover:text-stone-900 pointer-events-none">${cat.title.replace(' Chemistry', '')}</span>
          </button>
        `}).join('');

        container.innerHTML = `
          <div class="max-w-5xl mx-auto p-6 md:p-12 min-h-full flex flex-col items-center justify-center text-center animate-fade-in py-12">
            <div class="relative mb-12">
              <div class="absolute inset-0 bg-stone-200 blur-3xl opacity-30 rounded-full w-40 h-40 mx-auto"></div>
              <div class="relative bg-white p-6 rounded-2xl shadow-xl shadow-stone-200/50 border border-stone-100">
                 <i data-lucide="beaker" class="w-16 h-16 text-stone-800" stroke-width="1.5"></i>
              </div>
            </div>
            <h1 class="text-5xl md:text-7xl font-serif font-medium text-stone-900 mb-6 tracking-tight">The Novice <span class="text-teal-700 italic">Chemist</span></h1>
            <p class="text-lg md:text-xl text-stone-500 max-w-2xl mb-12 leading-relaxed font-light">Your complete digital companion for the <br/> <strong class="font-medium text-stone-700">Sri Lankan A-Level Chemistry</strong> syllabus.</p>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 max-w-5xl w-full mb-16 px-4">${categoryCards}</div>
            <button data-action="nav-category" data-id="organic" class="group relative inline-flex items-center gap-4 bg-stone-900 hover:bg-teal-800 text-white text-lg font-medium py-4 px-10 rounded-full transition-all duration-300 shadow-xl shadow-stone-200 hover:shadow-teal-100 hover:-translate-y-1 overflow-hidden">
              <span class="relative z-10 pointer-events-none">Start with Organic</span>
              <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform relative z-10"></i>
            </button>
          </div>
        `;
      }

      function renderContent(module, topic) {
        const container = document.getElementById('main-content');
        if (!container) return;
        
        container.innerHTML = `
          <div class="max-w-5xl mx-auto p-6 md:p-12 min-h-full animate-fade-in">
            <header class="mb-12 text-center">
              <div class="inline-block px-3 py-1 mb-4 text-xs font-bold tracking-widest text-teal-700 uppercase bg-teal-50 rounded-full border border-teal-100">${module.title.split(':')[0]}</div>
              <h1 class="text-4xl md:text-5xl font-serif font-medium text-stone-900 mb-4 leading-tight">${topic.title}</h1>
              <div class="h-1 w-20 bg-teal-600 mx-auto rounded-full opacity-80"></div>
            </header>
            <div class="prose prose-stone prose-lg max-w-none prose-headings:font-serif prose-headings:font-medium prose-p:text-stone-600 prose-a:text-teal-600 hover:prose-a:text-teal-700">
              ${topic.content}
            </div>
          </div>
        `;

        if (window.renderMathInElement) {
          try {
            window.renderMathInElement(container, {
              delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
              throwOnError: false
            });
          } catch(e) { console.warn("KaTeX render error", e); }
        }
      }

      // State Management
      let state = {
        currentCategoryId: null,
        currentModuleId: null,
        currentTopicId: null,
        isMobileMenuOpen: false
      };

      function render() {
        const { currentCategoryId, currentModuleId, currentTopicId, isMobileMenuOpen } = state;
        const currentCategory = CATEGORIES.find(c => c.id === currentCategoryId);
        const currentModule = currentCategory?.modules.find(m => m.id === currentModuleId);
        const currentTopic = currentModule?.topics.find(t => t.id === currentTopicId);

        renderNavbar(CATEGORIES, currentCategoryId);
        renderSidebar(currentCategory ? currentCategory.modules : [], currentModuleId, currentTopicId);

        if (currentCategory && currentModule && currentTopic) {
          renderContent(currentModule, currentTopic);
        } else {
          renderWelcome();
        }

        const sidebarContainer = document.getElementById('sidebar-container');
        const overlay = document.getElementById('mobile-overlay');
        
        if (sidebarContainer && overlay) {
          if (isMobileMenuOpen) {
            sidebarContainer.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
            sidebarContainer.classList.remove('hidden');
            sidebarContainer.classList.add('block');
          } else {
            sidebarContainer.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
          }
        }

        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      // Actions
      function navigateToCategory(categoryId) {
        const category = CATEGORIES.find(c => c.id === categoryId);
        if (category) {
          const moduleId = category.modules[0].id;
          const topicId = category.modules[0].topics[0].id;
          state.currentCategoryId = categoryId;
          state.currentModuleId = moduleId;
          state.currentTopicId = topicId;
          state.isMobileMenuOpen = false;
          pushRoute(categoryId, moduleId, topicId);
          render();
        }
      }

      function navigateToTopic(moduleId, topicId) {
        state.currentModuleId = moduleId;
        state.currentTopicId = topicId;
        state.isMobileMenuOpen = false;
        pushRoute(state.currentCategoryId, moduleId, topicId);
        render();
      }

      function goHome() {
        state = { currentCategoryId: null, currentModuleId: null, currentTopicId: null, isMobileMenuOpen: false };
        pushRoute(null);
        render();
      }

      // Initialization & Events
      document.body.addEventListener('click', (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;
        const action = target.dataset.action;

        if (action === 'nav-category') {
          e.preventDefault();
          navigateToCategory(target.dataset.id);
        } else if (action === 'nav-topic') {
          e.preventDefault();
          navigateToTopic(target.dataset.module, target.dataset.topic);
        } else if (action === 'go-home') {
          e.preventDefault();
          goHome();
        } else if (action === 'toggle-mobile-menu') {
          e.preventDefault();
          state.isMobileMenuOpen = !state.isMobileMenuOpen;
          render();
        }
      });

      const overlay = document.getElementById('mobile-overlay');
      if (overlay) overlay.addEventListener('click', () => { state.isMobileMenuOpen = false; render(); });

      window.addEventListener('hashchange', () => {
        const route = getRouteFromHash();
        state = { ...state, ...route };
        render();
      });

      window.addEventListener('DOMContentLoaded', () => {
        const route = getRouteFromHash();
        state = { ...state, ...route };
        render();
      });

    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
