<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Novice Chemist</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Importing Inter (UI), Playfair (Titles), Caveat (Headers/Fun), Patrick Hand (Handwriting Body) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@300;400;500;600&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- KaTeX (Math) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body { font-family: 'Inter', sans-serif; }
      
      /* Typography Overrides */
      .font-serif { font-family: 'Playfair Display', serif; }
      .font-hand-title { font-family: 'Caveat', cursive; }
      .font-hand-body { font-family: 'Patrick Hand', cursive; }
      
      /* Content Animation */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* DNA Animation */
      .dna-strand {
        stroke-dasharray: 10;
        animation: dash 3s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: 20; }
      }
      .dna-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 20px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #9ca3af; }

      /* Lined Paper Effect */
      .paper-bg {
        background-color: #fffefb; /* Very light warm paper color */
        background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
        background-size: 100% 2rem; /* 32px line height */
        /* Note: We handle text alignment in the typography class */
      }
    </style>
  </head>
  <body class="bg-stone-50 text-stone-800 antialiased selection:bg-teal-100 selection:text-teal-900 overflow-hidden h-screen flex flex-col">
    
    <!-- Navbar Container -->
    <header id="navbar-container" class="flex-none z-50"></header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Sidebar Container -->
        <!-- Modified to be controlled via width/transform classes injected by JS -->
        <aside id="sidebar-container" class="fixed inset-y-0 left-0 z-40 bg-stone-50/95 border-r border-stone-200 transition-all duration-300 transform md:relative md:translate-x-0 -translate-x-full w-0 md:w-80 overflow-hidden"></aside>
        
        <!-- Main Content -->
        <main id="main-content" class="flex-1 overflow-y-auto scroll-smooth bg-white w-full custom-scrollbar relative">
            <!-- Content Injected Here -->
        </main>
        
        <!-- Mobile Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-stone-900/20 backdrop-blur-sm z-30 hidden transition-opacity duration-300"></div>
    </div>

    <!-- MAIN APPLICATION SCRIPT -->
    <script>
       function handleScriptError(src) {
        console.error("Failed to load script:", src);
      }
    </script>

    <!-- App Logic -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>

    <!-- Category Configurations -->
    <script src="js/general/config.js" onerror="handleScriptError('js/general/config.js')"></script>
    <script src="js/inorganic/config.js" onerror="handleScriptError('js/inorganic/config.js')"></script>
    <script src="js/organic/config.js" onerror="handleScriptError('js/organic/config.js')"></script>
    <script src="js/physical/config.js" onerror="handleScriptError('js/physical/config.js')"></script>
    <script src="js/industrial/config.js" onerror="handleScriptError('js/industrial/config.js')"></script>
  </body>
</html>
