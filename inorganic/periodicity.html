<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodicity | Inorganic Chemistry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="../js/theme.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/sidebar.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>body { font-family: 'Inter', sans-serif; } h1,h2,h3 { font-family: 'Merriweather', serif; } .custom-scrollbar::-webkit-scrollbar { width: 4px; } .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans text-slate-600 dark:text-slate-400 text-sm md:text-base antialiased h-screen flex overflow-hidden transition-colors duration-300">
    <!-- Sidebar injected via JS -->

    <main class="flex-1 flex flex-col min-w-0 bg-white dark:bg-slate-900 relative transition-all duration-300 md:ml-72 peer-checked:md:ml-0">
        <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 sticky top-0 z-20 shadow-sm transition-colors duration-300">
             <div class="flex items-center gap-4"><label for="sidebar-toggle" class="p-2 -ml-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200 rounded-md cursor-pointer transition-colors"><i data-lucide="panel-left" class="w-5 h-5"></i></label><span class="font-medium text-slate-900 dark:text-white">Periodicity</span></div>
        </header>
        <div class="flex-1 overflow-y-auto p-6 md:p-12 lg:px-24">
            <div class="max-w-3xl mx-auto space-y-12 pb-20">
                <h1 class="text-4xl font-bold text-slate-900 dark:text-white">Periodicity</h1>
                <p class="text-lg text-slate-600 dark:text-slate-400">Trends in properties of elements across periods and down groups.</p>
                <div class="p-6 bg-purple-50 dark:bg-purple-900/20 border border-purple-100 dark:border-purple-900/50 rounded-lg">
                    <h3 class="font-bold text-purple-900 dark:text-purple-200 mb-2">Key Trends</h3>
                    <ul class="list-disc pl-5 text-purple-800 dark:text-purple-300">
                        <li>Atomic Radius decreases across a period.</li>
                        <li>Ionization Energy generally increases across a period.</li>
                        <li>Electronegativity increases towards Fluorine.</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
    <script>
        renderSidebar({ root: '../', module: 'inorganic', active: 'periodicity' });
        lucide.createIcons();
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {delimiters: [{left: "$", right: "$", display: false}]});
        });
    </script>
</body>
</html>
