<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamentals | Organic Chemistry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/sidebar.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .serif { font-family: 'Merriweather', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .dna-anim { stroke-dasharray: 10; animation: dash 10s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: 100; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen flex overflow-hidden">
    <!-- Sidebar injected via JS -->

    <main class="flex-1 flex flex-col min-w-0 bg-white relative transition-all duration-300 md:ml-72 peer-checked:md:ml-0">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-20 shadow-sm">
            <div class="flex items-center gap-4">
                <label for="sidebar-toggle" class="p-2 -ml-2 text-slate-500 hover:bg-slate-100 hover:text-slate-700 rounded-md cursor-pointer transition-colors" title="Toggle Sidebar">
                    <i data-lucide="panel-left" class="w-5 h-5"></i>
                </label>
                <nav class="flex items-center gap-2 text-sm text-slate-500">
                    <span class="hidden sm:inline">Organic</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                    <span class="font-medium text-slate-900">Fundamentals</span>
                </nav>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 md:p-12 lg:px-24">
            <div class="max-w-3xl mx-auto space-y-12 pb-20">
                <section>
                    <div class="mb-6"><span class="text-emerald-600 font-bold tracking-wider text-sm uppercase mb-1 block">1.1 Introduction</span><h1 class="text-4xl font-bold text-slate-900 leading-tight">Organic Chemistry Basics</h1></div>
                    <p class="text-lg text-slate-600 leading-8 mb-8 font-light">Organic Chemistry is the study of carbon compounds.</p>
                    
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-6 md:p-8">
                        <div class="grid md:grid-cols-2 gap-8 items-center">
                            <div>
                                <h3 class="text-xl font-bold text-slate-900 mb-4">Why is it important?</h3>
                                <ul class="space-y-4">
                                    <li class="flex gap-4 items-start">
                                        <div class="mt-1 p-1 bg-emerald-100 text-emerald-700 rounded"><i data-lucide="dna" class="w-4 h-4"></i></div>
                                        <div><strong class="block text-slate-900 text-sm">Basis of Life</strong><span class="text-sm text-slate-500">DNA, proteins, and cellular structures.</span></div>
                                    </li>
                                </ul>
                            </div>
                            <div class="flex justify-center border-l border-slate-100 pl-4">
                               <svg width="160" height="100" viewBox="0 0 200 100" class="opacity-70">
                                 <path d="M10,50 Q55,0 100,50 T190,50" fill="none" stroke="#059669" stroke-width="2" class="dna-anim" />
                                 <path d="M10,50 Q55,100 100,50 T190,50" fill="none" stroke="#34d399" stroke-width="2" class="dna-anim" style="animation-direction: reverse;" />
                               </svg>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script>
        renderSidebar({ root: '../', module: 'organic', active: 'fundamentals' });
        lucide.createIcons();
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ]
            });
        });
    </script>
</body>
</html>
